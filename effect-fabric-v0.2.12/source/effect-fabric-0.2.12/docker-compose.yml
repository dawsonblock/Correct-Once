services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${EFFECT_FABRIC_DB_USER:-effect}
      POSTGRES_PASSWORD: ${EFFECT_FABRIC_DB_PASSWORD:?set EFFECT_FABRIC_DB_PASSWORD}
      POSTGRES_DB: ${EFFECT_FABRIC_DB_NAME:-effect_fabric}
    ports:
      - "127.0.0.1:${EFFECT_FABRIC_DB_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      timeout: 2s
      retries: 20
