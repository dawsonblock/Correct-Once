[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effect-fabric"
version = "0.2.11"
description = "MCP-native consequential effect runtime for autonomous agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Effect Fabric contributors"}]
dependencies = [
  "pydantic>=2.7,<3",
  "cryptography>=42,<49",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "hypothesis>=6.110",
  "ruff>=0.6",
  "mypy>=1.11",
  "fastapi>=0.115",
  "httpx>=0.27",
  "types-setuptools>=69",
]

[project.scripts]
effect-fabric = "effect_fabric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = false

[tool.setuptools.data-files]
"share/effect-fabric/migrations" = ["migrations/*.sql"]
"share/effect-fabric/bridges/durable-agent-outbox" = [
  "bridges/durable-agent-outbox/*.mjs",
  "bridges/durable-agent-outbox/*.ts",
]
"share/effect-fabric/licenses" = ["THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]

"share/effect-fabric/spec" = ["spec/*.json"]
